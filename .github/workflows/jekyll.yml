name: Build and deploy Jekyll

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Debug img tags
        run: grep -r "img\|br\|hr\|input" ./_site --include="*.html" -h | head -20

      - name: Fix self-closing void element tags
        run: |
          find ./_site -name "*.html" -exec perl -pi -e 's/ \/>/>/g; s/\/>/>/g' {} \;

      - name: Debug after fix
        run: grep -r "img\|br\|hr\|input" ./_site --include="*.html" -h | head -20
        
      - name: Deploy
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
