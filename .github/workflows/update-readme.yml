name: Update README from info.json

on:
  push:
    branches:
      - main
    paths:
      - "templates-modeles/info.json"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate README
        working-directory: templates-modeles
        run: node action.js

      - name: Commit updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate README from info.json"
          file_pattern: "templates-modeles/README.md"
