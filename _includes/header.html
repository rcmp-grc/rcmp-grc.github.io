<header>
  <div class="container" id="wb-bnr">
    <div class="row">
      <section class="col-xs-3 col-sm-12 pull-right text-right" id="wb-lng">
        <h2 class="wb-inv">Language selection</h2>
        <ul class="list-inline mrgn-bttm-0">
          <li>
            <a href="{{ page.lang_url | default: 'index-fr.html' }}" hreflang="fr" lang="fr">
              <span class="hidden-xs" translate="no">Français</span>
              <span class="visible-xs h3 mrgn-tp-sm mrgn-bttm-0 text-uppercase" aria-hidden="true" translate="no">fr</span>
            </a>
          </li>
        </ul>
      </section>
      <div class="brand col-xs-9 col-sm-5 col-md-4" property="publisher" typeof="GovernmentOrganization">
        <a href="https://rcmp.ca/en" property="url">
          <img alt="Royal Canadian Mounted Police" property="logo" src="/assets/sig-blk-en.svg" />
        </a>
        <meta content="Royal Canadian Mounted Police" property="name" />
      </div>
      <section class="col-lg-offset-4 col-md-offset-4 col-sm-offset-2 col-xs-12 col-sm-5 col-md-4" id="wb-srch">
        <h2>Search</h2>
        <form action="https://www.canada.ca/en/royal-canadian-mounted-police/search.html#wb-land" id="cse-search-box" method="get" role="search">
          <div class="form-group wb-srch-qry">
            <label class="wb-inv" for="wb-srch-q">Search RCMP.ca</label>
            <input
              class="wb-srch-q form-control"
              id="wb-srch-q"
              maxlength="170"
              name="q"
              placeholder="Search RCMP.ca"
              type="search"
              autocomplete="off"
              value=""
            />
          </div>
          <div class="form-group submit">
            <button class="btn btn-primary btn-small" type="submit">
              <span class="glyphicon-search glyphicon"></span>
              <span class="wb-inv">Search</span>
            </button>
          </div>
        </form>
      </section>
    </div>
  </div>
  <div class="app-bar">
    <div class="container">
      <h2 class="h3 mrgn-tp-sm mrgn-bttm-sm">Royal Canadian Mounted Police</h2>
    </div>
  </div>
  {% include breadcrumb.html %}
</header>
