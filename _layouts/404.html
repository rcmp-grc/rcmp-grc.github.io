<!doctype html>
<html class="no-js" dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ page.title }}</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link href="/favicon.ico" rel="icon" type="image/x-icon" />
    <link rel="stylesheet" href="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/css/theme.min.css" />
    <link href="/assets/css/rcmp.css" rel="stylesheet" />
    <noscript><link rel="stylesheet" href="https://wet-boew.github.io/themes-dist/GCWeb/wet-boew/css/noscript.min.css" /></noscript>
    <meta name="description" content="{{ page.description_en }}" />
    <meta name="dcterms.title" content="{{ page.title }}" />
    <meta name="dcterms.description" content="{{ page.description_en }}" />
    <meta name="dcterms.creator" content="Royal Canadian Mounted Police" />
    <meta name="dcterms.language" content="eng" />
    <meta name="dcterms.subject" content="" />
    <meta name="dcterms.issued" content="{{ page.issued }}" />
    <meta name="dcterms.modified" content="{{ page.date_modified | default: site.time | date: '%Y-%m-%d' }}" />
    <meta property="dcterms:title" lang="en" content="{{ page.title }}" />
    <meta property="dcterms:creator" lang="en" content="Royal Canadian Mounted Police" />
    <meta property="dcterms:subject" lang="en" content="404 Error Page Not Found" />
    <meta property="dcterms:description" lang="en" content="{{ page.description_en }}" />
    <meta property="dcterms:title" lang="fr" content="{{ page.title }}" />
    <meta property="dcterms:creator" lang="fr" content="Gendarmerie royale du Canada" />
    <meta property="dcterms:subject" lang="fr" content="Page d'erreur 404 introuvable" />
    <meta property="dcterms:description" lang="fr" content="{{ page.description_fr }}" />
  </head>
  <body class="cnt-wdth-lmtd" vocab="http://schema.org/" resource="#wb-webpage" typeof="WebPage">
    <header>
      <div id="wb-bnr" class="container">
        <div class="row">
          <div class="brand col-xs-9 col-sm-5 col-md-4" property="publisher" typeof="GovernmentOrganization">
            <a href="https://rcmp.ca/en" property="url">
              <img src="/assets/sig-blk-en.svg" alt="Royal Canadian Mounted Police" property="logo" />
              <span class="wb-inv"> / <span lang="fr">Gendarmerie royale du Canada</span></span>
            </a>
            <meta property="name" content="Royal Canadian Mounted Police" />
            <meta property="areaServed" typeof="Country" content="Canada" />
            <link property="logo" href="/assets/wmms-blk.svg" />
          </div>
        </div>
      </div>
    </header>
    <main role="main" property="mainContentOfPage" resource="#wb-main" typeof="WebPageElement" class="container">
      <h1 class="wb-inv" id="wb-cont">Page not found / <span lang="fr">Page non trouvée</span></h1>
      <p class="wb-slc hidden-xs hidden-sm"><a class="wb-sl" href="#fr">Aller à la version française</a></p>
      {{ content }}
    </main>
    <script
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
    ></script>
    <script src="https://wet-boew.github.io/themes-dist/GCWeb/wet-boew/js/wet-boew.min.js"></script>
    <script src="https://wet-boew.github.io/themes-dist/GCWeb/GCWeb/js/theme.min.js"></script>
    <footer class="py-3">
      <div class="container" property="publisher" resource="#wb-publisher" typeof="GovernmentOrganization">
        <div class="align-self-end">
          <img id="wmms" src="/assets/wmms-blk.svg" alt="Symbol of the Government of Canada / Symbole du gouvernement du Canada" property="logo" />
        </div>
      </div>
    </footer>
  </body>
</html>
