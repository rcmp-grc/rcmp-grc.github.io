<!doctype html>
<html class="no-js" dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ page.title }}</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="{{ page.description_en }}" />
    <meta name="dcterms.title" content="{{ page.title }}" />
    <meta name="dcterms.description" content="{{ page.description_en }}" />
    <meta name="dcterms.creator" content="Royal Canadian Mounted Police" />
    <meta name="dcterms.language" content="eng" />
    <meta name="dcterms.subject" content="" />
    <meta name="dcterms.issued" content="{{ page.issued }}" />
    <meta name="dcterms.modified" content="{{ page.date_modified | default: site.time | date: '%Y-%m-%d' }}" />
    <meta property="dcterms:title" lang="en" content="{{ page.title }}" />
    <meta property="dcterms:creator" lang="en" content="Royal Canadian Mounted Police" />
    <meta property="dcterms:description" lang="en" content="{{ page.description_en }}" />
    <meta property="dcterms:title" lang="fr" content="{{ page.title }}" />
    <meta property="dcterms:creator" lang="fr" content="Gendarmerie royale du Canada" />
    <meta property="dcterms:description" lang="fr" content="{{ page.description_fr }}" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        background: #ffffff;
        color: #333333;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Skip link ── */
      .wb-slc {
        position: absolute;
        left: -9999px;
      }
      .wb-slc:focus {
        left: 0;
      }
      .wb-inv {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      /* ── Header — mirrors 404.html structure ── */
      #wb-bnr {
        background: #ffffff;
        border-bottom: 4px solid #af1e23;
        padding: 0.75rem 1.5rem;
      }
      #wb-bnr .row {
        display: flex;
        align-items: center;
      }
      .brand img {
        height: 44px;
        width: auto;
        display: block;
      }

      /* ── Main ── */
      main.container {
        flex: 1;
        max-width: 960px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
        width: 100%;
      }

      /* Image — no shadow, white bg */
      main img[src^="data:image"] {
        display: block;
        margin: 0 auto 2rem;
        width: min(320px, 88vw);
        height: auto;
        /* no filter, no box-shadow */
      }

      /* GCWeb-style label */
      .label {
        display: inline;
        padding: 0.2em 0.6em 0.3em;
        font-size: 75%;
        font-weight: 700;
        line-height: 1;
        color: #fff;
        text-align: center;
        white-space: nowrap;
        vertical-align: baseline;
        border-radius: 0.25em;
      }
      .label-danger {
        background-color: #af1e23;
      }

      /* Two-column row */
      .row {
        display: flex;
        flex-wrap: wrap;
        margin: 0 -15px;
      }
      .col-md-6 {
        flex: 0 0 50%;
        max-width: 50%;
        padding: 0 15px;
      }
      @media (max-width: 767px) {
        .col-md-6 {
          flex: 0 0 100%;
          max-width: 100%;
        }
        .hidden-xl.hidden-md.hidden-lg {
          display: block !important;
        }
      }
      .hidden-xl.hidden-md.hidden-lg {
        display: none;
      }

      h2 {
        font-size: 1.4rem;
        font-weight: 700;
        color: #1a2e4a;
        margin-bottom: 0.6rem;
        line-height: 1.25;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.7;
        margin-top: 0.6rem;
      }
      p:first-of-type {
        margin-top: 0.4rem;
      }

      /* ── Footer — mirrors 404.html ── */
      footer.py-3 {
        background: #ffffff;
        border-top: 1px solid #d8d8d8;
        padding: 0.75rem 1.5rem;
      }
      footer .container {
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        justify-content: flex-end;
      }
      footer img#wmms {
        height: 28px;
        width: auto;
      }
    </style>
  </head>
  <body vocab="http://schema.org/" resource="#wb-webpage" typeof="WebPage">
    <header>
      <div id="wb-bnr">
        <div class="row">
          <div class="brand col-xs-9 col-sm-5 col-md-4" property="publisher" typeof="GovernmentOrganization">
            <img src="/assets/sig-blk-en.svg" alt="Royal Canadian Mounted Police" property="logo" />
            <span class="wb-inv"> / <span lang="fr">Gendarmerie royale du Canada</span></span>
            <meta property="name" content="Royal Canadian Mounted Police" />
            <meta property="areaServed" typeof="Country" content="Canada" />
            <link property="logo" href="/assets/wmms-blk.svg" />
          </div>
        </div>
      </div>
    </header>
    <main role="main" property="mainContentOfPage" resource="#wb-main" typeof="WebPageElement" class="container">{{ content }}</main>
    <footer class="py-3">
      <div class="container" property="publisher" resource="#wb-publisher" typeof="GovernmentOrganization">
        <div class="align-self-end">
          <img id="wmms" src="/assets/wmms-blk.svg" alt="Symbol of the Government of Canada / Symbole du gouvernement du Canada" property="logo" />
        </div>
      </div>
    </footer>
  </body>
</html>
