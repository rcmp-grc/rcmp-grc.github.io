<!doctype html>
<html class="no-js" dir="ltr" lang="{{ page.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="{{ page.body_class | default: 'cnt-wdth-lmtd' }}" typeof="WebPage" vocab="http://schema.org/">
    <nav>
      <ul id="wb-tphp">
        <li class="wb-slc"><a class="wb-sl" href="#wb-cont">Skip to main content</a></li>
        <li class="wb-slc visible-sm visible-md visible-lg"><a class="wb-sl" href="#wb-info">Skip to About this site</a></li>
      </ul>
    </nav>

    {% include header.html %}

    <main class="container" property="mainContentOfPage" resource="#wb-main" typeof="WebPageElement">
      <h1 id="wb-cont" property="name">{{ page.title }}</h1>

      {{ content }}

      <section class="pagedetails">
        <h2 class="wb-inv">Page details</h2>
        <dl id="wb-dtmd">
          <dt>Date modified:</dt>
          <dd><time property="dateModified">{{ page.date_modified | default: site.time | date: "%Y-%m-%d" }}</time></dd>
        </dl>
      </section>
    </main>

    {% include footer.html %}
  </body>
</html>
